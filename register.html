<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Member Account | Solace Float Spa</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <meta name="description"
        content="Create a Solace Float Spa member account to book float session time slots and track sanctuary package usage.">

    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/rtl.css">

    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body class="auth-page">

    <!-- Utilities: kept in flow above the card so they never overlap it -->
    <div class="auth-topbar">
        <div class="auth-utils" style="margin-left: auto;">
            <button class="theme-toggle" aria-label="Toggle Theme">
                <i class="ph ph-moon"></i>
            </button>
            <button class="rtl-toggle" aria-label="Toggle Text Direction">
                <i class="ph ph-arrows-left-right"></i>
            </button>
        </div>
    </div>

    <div class="auth-shell">
        <main class="auth-card is-wide">
            <div class="auth-brand">
                <a href="index.html" class="navbar-brand" aria-label="Solace home">
                    <svg class="brand-logo" viewBox="0 0 200 60" preserveAspectRatio="xMinYMid meet" role="img"
                        aria-label="Solace">
                        <title>Solace</title>
                        <g transform="translate(4, 4) scale(1.15)">
                            <circle cx="24" cy="24" r="22" fill="#1A6B72" opacity="0.12" />
                            <circle cx="24" cy="24" r="22" fill="none" stroke="#52B69A" stroke-width="1.8"
                                opacity="0.4" />
                            <path d="M 24 3 A 21 21 0 1 1 4 26" fill="none" stroke="#52B69A" stroke-width="2"
                                stroke-linecap="round" opacity="0.75" />
                            <path d="M 24 8 A 16 16 0 1 1 9 28" fill="none" stroke="#52B69A" stroke-width="2"
                                stroke-linecap="round" opacity="0.85" />
                            <path d="M 24 13 A 11 11 0 1 1 14 29" fill="none" stroke="#52B69A" stroke-width="1.8"
                                stroke-linecap="round" opacity="0.95" />
                            <g transform="translate(24, 24) rotate(-35) translate(-24, -24)">
                                <circle cx="24" cy="10" r="3.2" fill="#1A6B72" />
                                <path
                                    d="M 21.5 14 C 21.5 14 20 22 21 28 C 22 33 22.5 38 22.5 38 L 25.5 38 C 25.5 38 26 33 27 28 C 28 22 26.5 14 26.5 14 Z"
                                    fill="#1A6B72" />
                                <path
                                    d="M 22 16 C 17 13 11 10 7 9 C 6.5 10.5 8 12.5 12 14.5 C 16 16.5 21.5 18 21.5 18 Z"
                                    fill="#1A6B72" />
                                <path
                                    d="M 26 16 C 31 13 37 10 41 9 C 41.5 10.5 40 12.5 36 14.5 C 32 16.5 26.5 18 26.5 18 Z"
                                    fill="#1A6B72" />
                            </g>
                        </g><text class="brand-text" x="66" y="42" font-family="'Lora','Georgia',serif"
                            font-weight="700" font-size="34" letter-spacing="-0.5" fill="currentColor">Solace</text>
                    </svg>
                </a>
            </div>

            <div class="auth-header">
                <h1>Join Solace Sanctuary</h1>
                <p>Create an account to book float sessions &amp; manage memberships</p>
            </div>

            <form action="parent-dashboard.html">
                <div class="form-group">
                    <label class="form-label" for="regName">Full Name</label>
                    <input type="text" class="form-control" id="regName" name="name" autocomplete="name" placeholder=""
                        required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="regEmail">Email Address</label>
                    <input type="email" class="form-control" id="regEmail" name="email" autocomplete="email"
                        placeholder="" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="regPassword">Password</label>
                    <div class="password-field">
                        <input type="password" class="form-control" id="regPassword" name="password"
                            autocomplete="new-password" placeholder="" required>
                        <button type="button" class="password-toggle" data-target="regPassword"
                            aria-label="Show password" aria-pressed="false">
                            <i class="ph ph-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="regConfirm">Confirm Password</label>
                    <div class="password-field">
                        <input type="password" class="form-control" id="regConfirm" name="confirm"
                            autocomplete="new-password" placeholder="" required>
                        <button type="button" class="password-toggle" data-target="regConfirm"
                            aria-label="Show password" aria-pressed="false">
                            <i class="ph ph-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="auth-row">
                    <label class="auth-check" for="terms">
                        <input type="checkbox" id="terms" name="terms" required checked>
                        <span>I agree to the <a href="#" class="auth-link">Sanctuary Rules</a> and <a href="#"
                                class="auth-link">Privacy Policy</a>.</span>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary btn-auth">Create Sanctuary Member Account</button>
            </form>

            <div class="auth-divider">or</div>

            <button type="button" class="btn btn-social">
                <svg viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg"
                    style="flex-shrink: 0;">
                    <path
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                        fill="#4285F4" />
                    <path
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                        fill="#34A853" />
                    <path
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22c-.87-2.6-2.87-4.53-6.16-4.53z"
                        fill="#FBBC05" />
                    <path
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"
                        fill="#EA4335" />
                </svg> Continue with Google
            </button>
            <button type="button" class="btn btn-social">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" xmlns="http://www.w3.org/2000/svg"
                    style="flex-shrink: 0;">
                    <path
                        d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.62-.75 1.04-1.8 0.93-2.85-.9.04-1.99.6-2.63 1.35-.57.66-.99 1.72-.85 2.74 1 .08 1.93-.49 2.55-1.24z" />
                </svg> Continue with Apple
            </button>

            <p class="auth-footer">
                Already a sanctuary member? <a href="login.html" class="auth-link">Login here</a>
            </p>
        </main>
    </div>

    <script src="assets/js/main.js"></script>
</body>

</html>
